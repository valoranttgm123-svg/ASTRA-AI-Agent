name: ASTRA CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Brain lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high


      - name: Diff check (pull request)
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Diff check (push)
        if: github.event_name == 'push'
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            git diff --check "${{ github.sha }}^...${{ github.sha }}"
          else
            git diff --check "$before...${{ github.sha }}"
          fi

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug working directory
        run: |
          pwd
          Get-ChildItem
          Get-ChildItem tests/

      - name: Unit and integration tests
        run: |
          $testFiles = Get-ChildItem tests/*.test.ts | ForEach-Object { $_.FullName }
          npx tsx --test --test-concurrency=1 $testFiles

      - name: Typecheck
        run: npm run typecheck

      - name: Brain lint
        run: npm run lint

      - name: Diff check (pull request)
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Diff check (push)
        if: github.event_name == 'push'
        run: |
          $before = "${{ github.event.before }}"
          if ($before -match "^0+$") {
            git diff --check "${{ github.sha }}^...${{ github.sha }}"
          } else {
            git diff --check "$before...${{ github.sha }}"
          }